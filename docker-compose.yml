# Vayu Protocol — local development stack
#
# Deterministic VayuEpochSettlement address when deployer = default Anvil
# account (0xf39F…) at nonce 0: 0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
# Override VAYU_SETTLEMENT_ADDRESS if you need a different deployment.
#
# Usage:
#   docker compose up --build          # first time or after code changes
#   docker compose up                  # subsequent starts
#   docker compose down -v             # tear down including volumes

name: vayu

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # The foundry image has ENTRYPOINT ["/bin/sh","-c"]. A string `command:`
    # gets split into a list by compose, which makes the flags become positional
    # shell args ($0/$1/…) instead of anvil args — anvil then defaults to
    # 127.0.0.1 and is unreachable from peer containers. Overriding entrypoint
    # to ["anvil"] bypasses the shell wrapper and passes flags correctly.
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vayu_indexer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 20s

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"   # Kubo API — relay uses this for pinning
      - "8081:8080"   # HTTP gateway — mapped to 8081 on host to avoid collision with relay
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ── Contract deployment (one-shot init container) ───────────────────────────

  contracts:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["forge"]
    command:
      - script
      - script/DeployVayuCore.s.sol
      - --rpc-url
      - http://anvil:8545
      - --broadcast
    working_dir: /contracts
    volumes:
      - ./contracts:/contracts
    environment:
      # Default Anvil account — dev only, never use in production
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      DEPLOY_FAUCET: "true"
      REGISTER_RELAY: "true"
    depends_on:
      anvil:
        condition: service_healthy
    # Retry if forge gets a transient connection refusal on first contact.
    # Exits 0 on success so dependent services are unblocked immediately.
    restart: on-failure

  # ── Protocol services ───────────────────────────────────────────────────────

  relay:
    build:
      context: ./relay
    ports:
      - "8080:8080"
    environment:
      RELAY_CHAIN_RPC_URL: http://anvil:8545
      RELAY_CHAIN_CHAIN_ID: "31337"
      # Deterministic Anvil address — matches nonce-0 deployment above
      RELAY_CHAIN_SETTLEMENT_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      RELAY_CHAIN_ON_CHAIN_COMMIT_ENABLED: "true"
      # Default Anvil account key — dev only, never use in production
      RELAY_CHAIN_RELAY_PRIVATE_KEY: "ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RELAY_IPFS_PROVIDER: kubo
      RELAY_IPFS_KUBO_API_URL: http://ipfs:5001
      RELAY_SECURITY_EIP712_CHAIN_ID: "31337"
      RELAY_SECURITY_EIP712_VERIFYING_CONTRACT: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      # Shorter epochs for local dev
      RELAY_EPOCH_DURATION_SECONDS: "60"
      RELAY_EPOCH_COMMIT_CHECK_INTERVAL_MS: "5000"
      RELAY_EPOCH_MIN_REPORTERS_PER_CELL: "1"
    depends_on:
      anvil:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  ponder:
    build:
      context: ./indexer
    ports:
      - "42069:42069"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vayu_indexer
      DATABASE_SCHEMA: public
      PONDER_RPC_URL_31337: http://anvil:8545
      # Deterministic Anvil address — must match the contracts service deployment
      VAYU_SETTLEMENT_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      VAYU_SETTLEMENT_START_BLOCK: "1"
      PONDER_PORT: "42069"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      contracts:
        condition: service_completed_successfully
    healthcheck:
      # /hello is served by the same Hono app as /graphql — cheap liveness check
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:42069/hello"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  sidecar:
    build:
      context: ./indexer
    # Invoke tsx directly to bypass the npm presidecar script (which requires .env + pg_isready)
    command: ["node_modules/.bin/tsx", "src/sidecar/index.ts"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vayu_indexer
      # Internal Docker hostname — Kubo gateway is port 8080 inside the network
      IPFS_GATEWAY_URL: http://ipfs:8080/ipfs
      SIDECAR_POLL_INTERVAL_MS: "15000"
      SIDECAR_BATCH_SIZE: "10"
    depends_on:
      ponder:
        condition: service_healthy
      ipfs:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      PONDER_URL: http://ponder:42069
    depends_on:
      ponder:
        condition: service_healthy

volumes:
  postgres_data:
  ipfs_data:
